[project]
name = "export217-shared"
version = "0.1.0"
description = "A collection of SQLAlchemy models, shared enums, Pydantic DTOs, DB utilities, and shared constants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.49",
]

[tool.hatch.build.targets.wheel]
packages = ["export217_shared"]