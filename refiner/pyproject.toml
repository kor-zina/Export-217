[project]
name = "export217-refiner"
version = "0.1.0"
description = "A collection of batch ETL jobs for parsing and ML pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "export217-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["export217_refiner"]

[tool.uv.sources]
export217-shared = { workspace = true }
